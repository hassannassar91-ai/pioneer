# Deploy: Render Dashboard → New → Blueprint → connect github.com/hassannassar91-ai/pioneer
# Live URL: https://pioneer-web.onrender.com
# No database — sessions/messages use signed cookies (same pattern as the Visions marketing site).

services:
  - type: web
    runtime: python
    name: pioneer-web
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn pioneer.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: pioneer-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://pioneer-web.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
