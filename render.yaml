# Deploy: Render Dashboard → New → Blueprint → connect github.com/hassannassar91-ai/pioneer
# Live URL: https://pss-om.onrender.com
# Custom domain: pss-om.com (DNS at your registrar must match Render’s instructions).

services:
  - type: web
    runtime: python
    name: pioneer-web
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn pioneer.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    domains:
      - pss-om.com
      - www.pss-om.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: pss-om.onrender.com,pss-om.com,www.pss-om.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://pss-om.onrender.com,https://pss-om.com,https://www.pss-om.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
